;/div&gt;&lt;/div&gt;&lt;/header&gt;&lt;nav&gt;&lt;a href=&quot;#cakupan&quot;&gt;Cakupan&lt;/a&gt;&lt;a href=&quot;#angka&quot;&gt;Angka&lt;/a&gt;&lt;a href=&quot;#sepi&quot;&gt;Saham sepi&lt;/a&gt;&lt;a href=&quot;#kode&quot;&gt;Kode&lt;/a&gt;&lt;a href=&quot;#hari-2026-08-20&quot;&gt;20 Agustus&lt;/a&gt;&lt;a href=&quot;#hari-2026-08-21&quot;&gt;21 Agustus&lt;/a&gt;&lt;a href=&quot;#hari-2026-08-22&quot;&gt;22 Agustus&lt;/a&gt;&lt;a href=&quot;#hari-2026-08-23&quot;&gt;23 Agustus&lt;/a&gt;&lt;a href=&quot;#hari-2026-08-24&quot;&gt;24 Agustus&lt;/a&gt;&lt;a href=&quot;#indeks&quot;&gt;Indeks penuh&lt;/a&gt;&lt;/nav&gt;&lt;main&gt;&lt;div class=&quot;searchbox&quot;&gt;&lt;label for=&quot;q&quot;&gt;&lt;strong&gt;Cari kode, penulis atau stream_id&lt;/strong&gt;&lt;/label&gt;&lt;input id=&quot;q&quot; placeholder=&quot;Contoh: CCSI, @Mirzal, 35079731&quot; type=&quot;search&quot;&gt;&lt;small class=&quot;muted&quot;&gt;Pencarian menyaring baris tabel. Kosongkan untuk melihat seluruh baris.&lt;/small&gt;&lt;/div&gt;&lt;section id=&quot;cakupan&quot;&gt;&lt;h2&gt;Cakupan dan cara membaca&lt;/h2&gt;&lt;p&gt;Analisis isi arsip 20–24 Agustus 2026; bukan verifikasi keadaan perusahaan, aturan, atau harga pada 14 September 2026.&lt;/p&gt;&lt;p&gt;Satu stream_id dihitung satu posting. Tag empat huruf bertanda dolar dihitung maksimal satu per posting, tanpa membedakan kapitalisasi; tag waran/rights dengan kode tambahan tidak digabungkan dengan saham induk. Tag acak belum dihapus. Banyaknya tag bukan sentimen.&lt;/p&gt;&lt;p&gt;Penghitungan dilakukan atas seluruh arsip. Pilihan harian merupakan penilaian mutu informasi dan argumen; bukan peringkat saham untuk dibeli atau peringkat keuntungan.&lt;/p&gt;&lt;p&gt;Semua ringkasan perusahaan di sini adalah isi atau penafsiran atas posting. Nama penulis, stream_id dan baris sumber disertakan agar pembaca dapat kembali ke arsip.&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Arsip bersama tidak menjamin kelengkapan seluruh Stockbit.&lt;/li&gt;&lt;li&gt;Interpretasi zona waktu API belum terverifikasi di kepala file.&lt;/li&gt;&lt;li&gt;Tidak ada lampiran gambar, transkrip video atau dokumen primer yang dirujuk oleh posting.&lt;/li&gt;&lt;li&gt;Tidak tersedia statistik hasil transaksi, pengikut, suka atau komentar untuk menilai kemampuan penulis.&lt;/li&gt;&lt;li&gt;Contoh PANI, BUVA, HELI dan Orbit dalam berkas panduan bukan otomatis temuan arsip.&lt;/li&gt;&lt;/ul&gt;&lt;/section&gt;&lt;section id=&quot;angka&quot;&gt;&lt;h2&gt;Penghitungan arsip&lt;/h2&gt;&lt;div class=&quot;table-wrap&quot;&gt;&lt;table class=&quot;&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Tanggal posting&lt;/th&gt;&lt;th&gt;Jumlah posting&lt;/th&gt;&lt;th&gt;Penulis unik&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr class=&quot;searchrow&quot;&gt;&lt;td&gt;2026-08-20&lt;/td&gt;&lt;td&gt;690&lt;/td&gt;&lt;td&gt;555&lt;/td&gt;&lt;/tr&gt;&lt;tr class=&quot;searchrow&quot;&gt;&lt;td&gt;2026-08-21&lt;/td&gt;&lt;td&gt;519&lt;/td&gt;&lt;td&gt;375&lt;/td&gt;&lt;/tr&gt;&lt;tr class=&quot;searchrow&quot;&gt;&lt;td&gt;2026-08-22&lt;/td&gt;&lt;td&gt;230&lt;/td&gt;&lt;td&gt;190&lt;/td&gt;&lt;/tr&gt;&lt;tr class=&quot;searchrow&quot;&gt;&lt;td&gt;2026-08-23&lt;/td&gt;&lt;td&gt;464&lt;/td&gt;&lt;td&gt;332&lt;/td&gt;&lt;/tr&gt;&lt;tr class=&quot;searchrow&quot;&gt;&lt;td&gt;2026-08-24&lt;/td&gt;&lt;td&gt;794&lt;/td&gt;&lt;td&gt;637&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;h3&gt;Tag yang paling sering muncul&lt;/h3&gt;&lt;div class=&quot;table-wrap&quot;&gt;&lt;table class=&quot;&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Tag&lt;/th&gt;&lt;th&gt;Posting&lt;/th&gt;&lt;th&gt;Penulis unik&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr class=&quot;searchrow&quot;&gt;&lt;td&gt;BMRI&lt;/td&gt;&lt;td&gt;232&lt;/td&gt;&lt;td&gt;199&lt;/td&gt;&lt;/tr&gt;&lt;tr class=&quot;searchrow&quot;&gt;&lt;td&gt;IHSG&lt;/td&gt;&lt;td&gt;216&lt;/td&gt;&lt;td&gt;161&lt;/td&gt;&lt;/tr&gt;&lt;tr class=&quot;searchrow&quot;&gt;&lt;td&gt;GOTO&lt   var frame = document.getElementById('report-content'), sequence = 0, pending = null;
  window.archiveFind = function(query){
    if (typeof query !== 'string' || query.length > 128) return Promise.resolve(null);
    if (pending) pending.finish(null);
    return new Promise(function(resolve){
      var id = ++sequence, timer = setTimeout(function(){ finish(null); }, 2500);
      function finish(value){ clearTimeout(timer); if (pending && pending.id === id) pending = null; resolve(value); }
      pending = {id:id, finish:finish};
      frame.contentWindow.postMessage({type:'archive:find', id:id, query:query}, '*');
    });
  };
  window.archiveJump = function(){ frame.contentWindow.postMessage({type:'archive:jump',id:sequence}, '*'); };
  window.addEventListener('message', function(event){
    var m = event.data;
    if (event.source !== frame.contentWindow || event.origin !== 'null' || !pending || !m ||
        m.type !== 'archive:found' || m.id !== pending.id || !Number.isInteger(m.total) || m.total < 0 || m.total > 500) return;
    pending.finish(m.total);
  });
  if (window !== window.parent) document.getElementById('report-nav').hidden = true;
})();
</script></body></html>

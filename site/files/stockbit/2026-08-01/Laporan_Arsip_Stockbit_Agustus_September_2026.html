&lt;li class=&quot;item&quot; id=&quot;p35269898&quot;&gt;&lt;strong&gt;DSSA&lt;/strong&gt;&lt;p&gt;DSSA: kenaikan intrahari yang tidak bertahan sampai penutupan dipandang sebagai peringatan. Istilah pembelian institusional dalam teks tidak membuktikan siapa pembeli sesungguhnya.&lt;/p&gt;&lt;div class=&quot;source&quot;&gt;&lt;a href=&quot;https://stockbit.com/post/35269898&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;31 Agustus 2026 · @ImamMashabi · Stream 35269898&lt;/a&gt;&lt;span class=&quot;locator&quot;&gt; · arsip, baris fisik 68293–68312&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li class=&quot;item&quot; id=&quot;p35310622&quot;&gt;&lt;strong&gt;KUAS&lt;/strong&gt;&lt;p&gt;KUAS: kenaikan laba dibanding kuartal sebelumnya dibedakan dari penurunan laba kumulatif tahunan. Basis perbandingan yang berbeda dapat menghasilkan cerita pertumbuhan yang bertolak belakang.&lt;/p&gt;&lt;div class=&quot;source&quot;&gt;&lt;a href=&quot;https://stockbit.com/post/35310622&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;31 Agustus 2026 · @kurosagi · Stream 35310622&lt;/a&gt;&lt;span class=&quot;locator&quot;&gt; · arsip, baris fisik 58018–58074&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li class=&quot;item&quot; id=&quot;p35269271&quot;&gt;&lt;strong&gt;Indeks pasar&lt;/strong&gt;&lt;p&gt;Pengguna mengaitkan perubahan indeks dengan kemungkinan lonjakan transaksi. Jadwal yang disebut dalam arsip tidak menjadi bukti keputusan indeks atau besaran aliran dana yang terjadi.&lt;/p&gt;&lt;div class=&quot;source&quot;&gt;&lt;a href=&quot;https://stockbit.com/post/35269271&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;31 Agustus 2026 · @JhonWong · Stream 35269271&lt;/a&gt;&lt;span class=&quot;locator&quot;&gt; · arsip, baris fisik 71491–71560&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;/ol&gt;&lt;/details&gt;
&lt;details class=&quot;day&quot; id=&quot;d2026-09-01&quot;&gt;&lt;summary&gt;1 September 2026&lt;span class=&quot;count&quot;&gt;10 pilihan dari 1.645 unggahan&lt;/span&gt;&lt;/summary&gt;&lt;ol class=&quot;daily&quot;&gt;
&lt;li class=&quot;item&quot; id=&quot;p35314463&quot;&gt;&lt;strong&gt;FORU&lt;/strong&gt;&lt;p&gt;FORU: penulis berspekulasi saham dan hak penambahan modal mungkin terkonsentrasi pada IMR serta afiliasinya. Ia mengakui dilusi besar dan bahwa dugaan minimnya distribusi dapat salah.&lt;/p&gt;&lt;div class=&quot;source&quot;&gt;&lt;a href=&quot;https://stockbit.com/post/35314463&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;1 September 2026 · @Mirzal · Stream 35314463&lt;/a&gt;&lt;span class=&quot;locator&quot;&gt; · arsip, baris fisik 47211–47243&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li class=&quot;item&quot; id=&quot;p35314811&quot;&gt;&lt;strong&gt;KOTA&lt;/strong&gt;&lt;p&gt;KOTA: pengguna menelusuri penjual lahan yang disebut memperoleh kepemilikan melalui konversi utang, serta riwayat pembatalan transaksi. Istilah rekayasa dalam unggahan bukan bukti penipuan.&lt;/p&gt;&lt;div class=&quot;source&quot;&gt;&lt;a href=&quot;https://stockbit.com/post/35314811&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;1 September 2026 · @klinikporto · Stream 35314811&lt;/a&gt;&lt;span class=&quot;locator&quot;&gt; · arsip, baris fisik 45204–45257&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li class=&quot;item&quot; id=&quot;p35313208&quot;&gt;&lt;strong&gt;FORU&lt;/strong&gt;&lt;p&gt;FORU: penilaian lama perusahaan dibedakan dari kondisi setelah aset tambang masuk. Risiko harga komoditas, penggabungan usaha, dan kepatuhan tetap melekat pada rencana transformasi.&lt;/p&gt;&lt;div class=&quot;source&quot;&gt;&lt;a href=&quot;https://stockbit.com/post/35313208&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;1 September 2026 · @kurosagi · Stream 35313208&lt;/a&gt;&lt;span class=&quot;locator&quot;&gt; · arsip, baris fisik 54825–54888&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li class=&quot;item&quot; id=&quot;p35312555&quot;&gt;&lt;strong&gt;PIPA&lt;/strong&gt;&lt;p&gt;PIPA: ukuran target dan proyeksinya dibandingkan dengan aset serta kas perusahaan yang jauh lebih kecil. Cara pendanaan dan persetujuan transaksi menjadi pertanyaan penentu.&lt;/p&gt;&lt;div class=&quot;source&quot;&gt;&lt;a href=&quot;https://stockbit.com/post/35312555&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;1 September 2026 · @agumdarmawan2402 · Stream 35312555&lt;/a&gt;&lt;span class=&quot;locator&quot;&gt; · arsip, baris fisik 57797–57860&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li class=&quot;item&quot; id=&quot;p35312680&quot;&gt;&lt;strong&gt;COCO&lt;/strong&gt;&lt;p&gt;COCO: pembahasan menghubungkan tambahan modal dengan perubahan skala usaha. Hasil akuisisi, kemampuan laba, dan penambahan saham tetap harus dinilai terpisah dari pemulihan harga.&lt;/p&gt;&lt;div class=&quot;source&quot;&gt;&lt;a href=&quot;https://stockbit.com/post/35312680&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;1 September 2026 · @agumdarmawan2402 · Stream 35312680&lt;/a&gt;&lt;span class=&quot;locator&quot;&gt; · arsip, baris fisik 57126–57193&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li class=&quot;item&quot; id=&quot;p35317769&quot;&gt;&lt;strong&gt;PTBA&lt;/strong&gt;&lt;p&gt;PTBA: kenaikan laba dijelaskan melalui harga jual batu bara yang lebih tinggi. Keberlanjutan keuntungan tetap bergantung pada volume, biaya, serta siklus harga komoditas.&lt;/p&gt;&lt;div class=&quot;source&quot;&gt;&lt;a href=&quot;https://stockbit.com/post/35317769&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;1 September 2026 · @Stockbit · Stream 35317769&lt;/a&gt;&lt;span class=&quot;locator&quot;&gt; · arsip, baris fisik 40978–41013&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li class=&quot;item&quot; id=&quot;p35337864&quot;&gt;&lt;strong&gt;Konsumer / perbankan&lt;/strong&gt;&lt;p&gt;Stockbit membandingkan tekanan bahan baku pada konsumer dengan peluang laba bank. Ini penilaian sektoral bersyarat, bukan jaminan semua saham bank lebih baik.&lt;/p&gt;&lt;div class=&quot;source&quot;&gt;&lt;a href=&quot;https://stockbit.com/post/35337864&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;1 September 2026 · @Stockbit · Stream 35337864&lt;/a&gt;&lt;span class=&quot;locator&quot;&gt; · arsip, baris fisik 38384–38409&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li class=&quot;item&quot; id=&quot;p35314166&quot;&gt;&lt;strong&gt;SIDO&lt;/strong&gt;&lt;p&gt;SIDO: penjualan ke distributor yang turun dibandingkan dengan pembelian konsumen akhir yang naik serta penurunan piutang. Ini usaha menjelaskan selisih permintaan akhir dan pengisian persediaan.&lt;/p&gt;&lt;div class=&quot;source&quot;&gt;&lt;a href=&quot;https://stockbit.com/post/35314166&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;1 September 2026 · @argountuksaham · Stream 35314166&lt;/a&gt;&lt;span class=&quot;locator&quot;&gt; · arsip, baris fisik 48358–48386&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li class=&quot;item&quot; id=&quot;p35314006&quot;&gt;&lt;strong&gt;MGLV&lt;/strong&gt;&lt;p&gt;MGLV: penjualan sebagian saham oleh Nextier dilaporkan menurunkan kepemilikan dari 67,66% menjadi 66,93%. Ini pembanding terhadap anggapan pengendali selalu menambah saham saat perubahan usaha.&lt;/p&gt;&lt;div class=&quot;source&quot;&gt;&lt;a href=&quot;https://stockbit.com/post/35314006&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;1 September 2026 · @Stockbit · Stream 35314006&lt;/a&gt;&lt;span class=&quot;locator&quot;&gt; · arsip, baris fisik 50428–50444&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li class=&quot;item&quot; id=&quot;p35359628&quot;&gt;&lt;strong&gt;PACK&lt;/strong&gt;&lt;p&gt;PACK: pencatatan saham dari obligasi wajib konversi dianalisis dari sisi tambahan modal dan dilusi. Konversi kecil per hari perlu dibandingkan dengan seluruh sisa kewajiban konversi.&lt;/p&gt;&lt;div class=&quot;source&quot;&gt;&lt;a href=&quot;https://stockbit.com/post/35359628&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;1 September 2026 · @manifesto · Stream 35359628&lt;/a&gt;&lt;span class=&quot;locator&quot;&gt; · arsip, baris fisik 37670–37687&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;/ol&gt;&lt;/details&gt;
&lt;details class=&quot;day&quot; id=&quot;d2026-09-02&quot;&gt;&lt;summary&gt;2 September 2026&lt;span class=&quot;count&quot;&gt;10 pilihan dari 373 unggahan&lt;/span&gt;&lt;/summary&gt;&lt;ol class=&quot;daily&quot;&gt;
&lt;li class=&quot;item&quot; id=&quot;p35362249&quot;&gt;&lt;strong&gt;SMBR&lt;/strong&gt;&lt;p&gt;SMBR: penurunan laba bersih disandingkan dengan margin bruto yang membaik dan kas operasi positif. Satu indikator yang membaik belum cukup menjelaskan keseluruhan hasil usaha.&lt;/p&gt;&lt;div class=&quot;source&quot;&gt;&lt;a href=&quot;https://stockbit.com/post/35362249&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;2 September 2026 · @StockbitNews · Stream 35362249&lt;/a&gt;&lt;span class=&quot;locator&quot;&gt; · arsip, baris fisik 36061–36078&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li class=&quot;item&quot; id=&quot;p35362251&quot;&gt;&lt;strong&gt;OBMD&lt;/strong&gt;&lt;p&gt;OBMD: ringkasan menampilkan margin bruto di atas 100%. Angka ini perlu dicocokkan dengan rincian pendapatan dan beban sebelum dipakai sebagai ukuran efisiensi normal.&lt;/p&gt;&lt;div class=&quot;source&quot;&gt;&lt;a href=&quot;https://stockbit.com/post/35362251&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;2 September 2026 · @StockbitNews · Stream 35362251&lt;/a&gt;&lt;span class=&quot;locator&quot;&gt; · arsip, baris fisik 36043–36060&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li class=&quot;item&quot; id=&quot;p35362016&quot;&gt;&lt;strong&gt;PGJO&lt;/strong&gt;&lt;p&gt;PGJO: lonjakan penjualan dari jasa angkut dihubungkan dengan pertambahan aset yang dibiayai utang pihak berelasi. Pertumbuhan usaha baru harus dibaca bersama kewajiban pendanaannya.&lt;/p&gt;&lt;div class=&quot;source&quot;&gt;&lt;a href=&quot;https://stockbit.com/post/35362016&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;2 September 2026 · @ROVIDI · Stream 35362016&lt;/a&gt;&lt;span class=&quot;locator&quot;&gt; · arsip, baris fisik 37172–37186&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li class=&quot;item&quot; id=&quot;p35362241&quot;&gt;&lt;strong&gt;Makro&lt;/strong&gt;&lt;p&gt;Pandangan pasar menempatkan konflik dan rupiah sebagai sumber ketidakpastian. Angka serta ramalan makro dalam unggahan tidak membuktikan perubahan transaksi pada emiten tertentu.&lt;/p&gt;&lt;div class=&quot;source&quot;&gt;&lt;a href=&quot;https://stockbit.com/post/35362241&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;2 September 2026 · @Elroynatanael · Stream 35362241&lt;/a&gt;&lt;span class=&quot;locator&quot;&gt; · arsip, baris fisik 36112–36280&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li class=&quot;item&quot; id=&quot;p35363962&quot;&gt;&lt;strong&gt;Keterbatasan skor&lt;/strong&gt;&lt;p&gt;Daftar saham menggunakan persentase keyakinan dan perkiraan nilai wajar. Tanpa pengujian hasil serta definisi probabilitas, persentase tersebut bukan peluang keberhasilan yang terukur.&lt;/p&gt;&lt;div class=&quot;source&quot;&gt;&lt;a href=&quot;https://stockbit.com/post/35363962&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;2 September 2026 · @ronggat · Stream 35363962&lt;/a&gt;&lt;span class=&quot;locator&quot;&gt; · arsip, baris fisik 35099–35118&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li class=&quot;item&quot; id=&quot;p35362021&quot;&gt;&lt;strong&gt;BBRI / KOTA&lt;/strong&gt;&lt;p&gt;BBRI: pertumbuhan kredit dibandingkan dengan kemungkinan penurunan porsi laba untuk dividen. Rencana akuisisi lahan KOTA dalam unggahan yang sama merupakan persoalan terpisah.&lt;/p&gt;&lt;div class=&quot;source&quot;&gt;&lt;a href=&quot;https://stockbit.com/post/35362021&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;2 September 2026 · @gunawanzhy · Stream 35362021&lt;/a&gt;&lt;span class=&quot;locator&quot;&gt; · arsip, baris fisik 37129–37137&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li class=&quot;item&quot; id=&quot;p35361980&quot;&gt;&lt;strong&gt;SBMA&lt;/strong&gt;&lt;p&gt;SBMA: pengguna menyoroti struktur saham dan kebutuhan gas industri. Konsentrasi kepemilikan bukan bukti pasokan saham aman ataupun bisnis pasti berkembang.&lt;/p&gt;&lt;div class=&quot;source&quot;&gt;&lt;a href=&quot;https://stockbit.com/post/35361980&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;2 September 2026 · @Adnugraa · Stream 35361980&lt;/a&gt;&lt;span class=&quot;locator&quot;&gt; · arsip, baris fisik 37323–37350&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li class=&quot;item&quot; id=&quot;p35362025&quot;&gt;&lt;strong&gt;AUTO / UNTR / GOTO&lt;/strong&gt;&lt;p&gt;AUTO: jadwal dan harga tender sukarela dikemukakan bersama kabar UNTR dan GOTO. Ketentuan tender memerlukan dokumen resmi serta pemeriksaan kelayakan, jumlah pembelian, dan perubahan jadwal.&lt;/p&gt;&lt;div class=&quot;source&quot;&gt;&lt;a href=&quot;https://stockbit.com/post/35362025&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;2 September 2026 · @gunawanzhy · Stream 35362025&lt;/a&gt;&lt;span class=&quot;locator&quot;&gt; · arsip, baris fisik 37108–37117&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li class=&quot;item&quot; id=&quot;p35364298&quot;&gt;&lt;strong&gt;PGAS&lt;/strong&gt;&lt;p&gt;PGAS: rincian sengketa dengan Gunvor dibedakan antara klaim yang diputus dan klaim yang belum diputus. Dampak keuangan belum boleh dianggap selesai untuk seluruh periode kontrak.&lt;/p&gt;&lt;div class=&quot;source&quot;&gt;&lt;a href=&quot;https://stockbit.com/post/35364298&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;2 September 2026 · @Stockbit · Stream 35364298&lt;/a&gt;&lt;span class=&quot;locator&quot;&gt; · arsip, baris fisik 34977–34999&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li class=&quot;item&quot; id=&quot;p35362034&quot;&gt;&lt;strong&gt;VKTR&lt;/strong&gt;&lt;p&gt;VKTR: kesepakatan awal pendanaan disebut belum mengikat. Nilai yang dibicarakan belum berarti kas diterima atau kepemilikan berubah; ketentuan final menjadi pembeda penting.&lt;/p&gt;&lt;div class=&quot;source&quot;&gt;&lt;a href=&quot;https://stockbit.com/post/35362034&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;2 September 2026 · @ROVIDI · Stream 35362034&lt;/a&gt;&lt;span class=&quot;locator&quot;&gt; · arsip, baris fisik 37083–37091&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;/ol&gt;&lt;/details&gt;
&lt;details class=&quot;day&quot; id=&quot;d2026-09-03&quot;&gt;&lt;summary&gt;3 September 2026&lt;span class=&quot;count&quot;&gt;10 pilihan dari 1.284 unggahan&lt;/span&gt;&lt;/summary&gt;&lt;ol class=&quot;daily&quot;&gt;
&lt;li class=&quot;item&quot; id=&quot;p35414773&quot;&gt;&lt;strong&gt;CBRE&lt;/strong&gt;&lt;p&gt;CBRE: mayoritas dana penambahan modal disebut untuk mengonversi utang empat kreditur. Bagian ini berbeda dari uang tunai baru untuk membeli kapal; pembeli siaga tidak menjamin nilai saham.&lt;/p&gt;&lt;div class=&quot;source&quot;&gt;&lt;a href=&quot;https://stockbit.com/post/35414773&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;3 September 2026 · @klinikporto · Stream 35414773&lt;/a&gt;&lt;span class=&quot;locator&quot;&gt; · arsip, baris fisik 22332–22370&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li class=&quot;item&quot; id=&quot;p35408640&quot;&gt;&lt;strong&gt;KOIN&lt;/strong&gt;&lt;p&gt;KOIN: laba membaik dibandingkan dengan ekuitas yang masih negatif dan status penghentian perdagangan. Penulis menolak menganggap penerbitan saham oleh SCG sudah pasti tanpa pengumuman resmi.&lt;/p&gt;&lt;div class=&quot;source&quot;&gt;&lt;a href=&quot;https://stockbit.com/post/35408640&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;3 September 2026 · @Rudyasiong · Stream 35408640&lt;/a&gt;&lt;span class=&quot;locator&quot;&gt; · arsip, baris fisik 32183–32373&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li class=&quot;item&quot; id=&quot;p35414910&quot;&gt;&lt;strong&gt;ASII / AUTO&lt;/strong&gt;&lt;p&gt;AUTO: rencana ASII menambah saham akan mengurangi kepemilikan publik jika terlaksana. Pengaruh kepada laba induk dan ketersediaan saham perlu dihitung terpisah.&lt;/p&gt;&lt;div class=&quot;source&quot;&gt;&lt;a href=&quot;https://stockbit.com/post/35414910&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;3 September 2026 · @theinvestorid · Stream 35414910&lt;/a&gt;&lt;span class=&quot;locator&quot;&gt; · arsip, baris fisik 22252–22285&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li class=&quot;item&quot; id=&quot;p35410419&quot;&gt;&lt;strong&gt;MYOR&lt;/strong&gt;&lt;p&gt;MYOR: penulis menandai pengembalian modal sebagai hasil perhitungannya, bukan rasio resmi perusahaan. Pengungkapan asumsi ini membantu pembaca memeriksa metode dan hasil.&lt;/p&gt;&lt;div class=&quot;source&quot;&gt;&lt;a href=&quot;https://stockbit.com/post/35410419&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;3 September 2026 · @Indra619 · Stream 35410419&lt;/a&gt;&lt;span class=&quot;locator&quot;&gt; · arsip, baris fisik 24409–24434&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li class=&quot;item&quot; id=&quot;p35410485&quot;&gt;&lt;strong&gt;VKTR&lt;/strong&gt;&lt;p&gt;VKTR: pendanaan dan nama pemegang saham dikaitkan dengan kemungkinan hubungan rantai usaha. Kaitan Glencore masih bersyarat dalam teks dan tidak membuktikan kontrak baru.&lt;/p&gt;&lt;div class=&quot;source&quot;&gt;&lt;a href=&quot;https://stockbit.com/post/35410485&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;3 September 2026 · @Helmysabri · Stream 35410485&lt;/a&gt;&lt;span class=&quot;locator&quot;&gt; · arsip, baris fisik 24107–24157&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li class=&quot;item&quot; id=&quot;p35409905&quot;&gt;&lt;strong&gt;MYOR&lt;/strong&gt;&lt;p&gt;MYOR: perubahan persediaan, piutang pihak berelasi, dan investasi dibandingkan dengan laba. Analisis menekankan apa yang benar-benar menghasilkan kas dalam periode berjalan.&lt;/p&gt;&lt;div class=&quot;source&quot;&gt;&lt;a href=&quot;https://stockbit.com/post/35409905&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;3 September 2026 · @Indra619 · Stream 35409905&lt;/a&gt;&lt;span class=&quot;locator&quot;&gt; · arsip, baris fisik 26772–26801&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li class=&quot;item&quot; id=&quot;p35410383&quot;&gt;&lt;strong&gt;CYBR&lt;/strong&gt;&lt;p&gt;CYBR: kenaikan margin laba bersih searah dengan kenaikan margin usaha dianggap mendukung pemulihan operasi. Keberlanjutan proyek dan pengakuan pendapatan tetap perlu diuji.&lt;/p&gt;&lt;div class=&quot;source&quot;&gt;&lt;a href=&quot;https://stockbit.com/post/35410383&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;3 September 2026 · @marketedgeview · Stream 35410383&lt;/a&gt;&lt;span class=&quot;locator&quot;&gt; · arsip, baris fisik 24590–24607&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li class=&quot;item&quot; id=&quot;p35409591&quot;&gt;&lt;strong&gt;VKTR&lt;/strong&gt;&lt;p&gt;VKTR: pengguna mengukur besarnya pendanaan dibandingkan dengan ekuitas dan laba yang kecil. Namun pembanding nilai buku saja tidak menentukan kepemilikan setelah konversi tanpa harga dan jumlah saham.&lt;/p&gt;&lt;div class=&quot;source&quot;&gt;&lt;a href=&quot;https://stockbit.com/post/35409591&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;3 September 2026 · @hendrafa · Stream 35409591&lt;/a&gt;&lt;span class=&quot;locator&quot;&gt; · arsip, baris fisik 27818–27848&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li class=&quot;item&quot; id=&quot;p35409773&quot;&gt;&lt;strong&gt;WEHA&lt;/strong&gt;&lt;p&gt;WEHA: penagihan cepat dan penerimaan di muka dibandingkan dengan efisiensi modal. Karakter arus kas perusahaan transportasi berbeda dari perusahaan dengan piutang panjang.&lt;/p&gt;&lt;div class=&quot;source&quot;&gt;&lt;a href=&quot;https://stockbit.com/post/35409773&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;3 September 2026 · @kurosagi · Stream 35409773&lt;/a&gt;&lt;span class=&quot;locator&quot;&gt; · arsip, baris fisik 27062–27143&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li class=&quot;item&quot; id=&quot;p35410384&quot;&gt;&lt;strong&gt;CHEM&lt;/strong&gt;&lt;p&gt;CHEM: laba kuartalan yang berbalik positif dibandingkan dengan hasil tahunan dan piutang yang lama tertagih. Penilaian buruk terhadap manajemen dalam judul tetap merupakan opini penulis.&lt;/p&gt;&lt;div class=&quot;source&quot;&gt;&lt;a href=&quot;https://stockbit.com/post/35410384&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;3 September 2026 · @kurosagi · Stream 35410384&lt;/a&gt;&lt;span class=&quot;locator&quot;&gt; · arsip, baris fisik 24510–24589&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;/ol&gt;&lt;/details&gt;
&lt;details class=&quot;day&quot; id=&quot;d2026-09-04&quot;&gt;&lt;summary&gt;4 September 2026&lt;span class=&quot;count&quot;&gt;10 pilihan dari 1.136 unggahan&lt;/span&gt;&lt;/summary&gt;&lt;ol class=&quot;daily&quot;&gt;
&lt;li class=&quot;item&quot; id=&quot;p35472489&quot;&gt;&lt;strong&gt;Gandasari / target tidak diungkap&lt;/strong&gt;&lt;p&gt;Pengguna memberi petunjuk Gandasari melalui kesamaan alamat dan direktur dengan calon pembeli sebuah emiten. Target tidak disebutkan, sehingga tidak boleh ditebak hanya dari unggahan di sebelahnya.&lt;/p&gt;&lt;div class=&quot;source&quot;&gt;&lt;a href=&quot;https://stockbit.com/post/35472489&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;4 September 2026 · @Poniman526 · Stream 35472489&lt;/a&gt;&lt;span class=&quot;locator&quot;&gt; · arsip, baris fisik 8124–8140&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li class=&quot;item&quot; id=&quot;p35472331&quot;&gt;&lt;strong&gt;PCAR&lt;/strong&gt;&lt;p&gt;PCAR: unggahan singkat menyebut akuisisi “samudra” tanpa nama badan hukum, nilai, atau dokumen. Petunjuk ini belum cukup untuk memastikan pihak transaksi ataupun hubungannya dengan Gandasari.&lt;/p&gt;&lt;div class=&quot;source&quot;&gt;&lt;a href=&quot;https://stockbit.com/post/35472331&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;4 September 2026 · @MuhammadAkbar299 · Stream 35472331&lt;/a&gt;&lt;span class=&quot;locator&quot;&gt; · arsip, baris fisik 8149–8156&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li class=&quot;item&quot; id=&quot;p35491780&quot;&gt;&lt;strong&gt;SQMI&lt;/strong&gt;&lt;p&gt;SQMI: nama Yunnan Chihong muncul sebagai harapan dengan nada bercanda. Tidak ada rincian perjanjian atau bukti kepemilikan; nama pembeli saja belum menguatkan transaksi.&lt;/p&gt;&lt;div class=&quot;source&quot;&gt;&lt;a href=&quot;https://stockbit.com/post/35491780&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;4 September 2026 · @Rama1098 · Stream 35491780&lt;/a&gt;&lt;span class=&quot;locator&quot;&gt; · arsip, baris fisik 5941–5950&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li class=&quot;item&quot; id=&quot;p35481459&quot;&gt;&lt;strong&gt;TSPC&lt;/strong&gt;&lt;p&gt;TSPC: pengguna merekonsiliasi kenaikan saham pendiri dengan penurunan dua kelompok pemegang. Kecocokan aritmetika membantu penelusuran, tetapi tidak membuktikan satu kelompok adalah pemegang titipan.&lt;/p&gt;&lt;div class=&quot;source&quot;&gt;&lt;a href=&quot;https://stockbit.com/post/35481459&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;4 September 2026 · @Noble · Stream 35481459&lt;/a&gt;&lt;span class=&quot;locator&quot;&gt; · arsip, baris fisik 6434–6469&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li class=&quot;item&quot; id=&quot;p35482549&quot;&gt;&lt;strong&gt;SINI / CUAN&lt;/strong&gt;&lt;p&gt;SINI: ringkasan menyebut rencana transaksi baru CUAN, sementara rencana Desember 2025 dihentikan. Mekanisme, harga, dan waktu masih dinegosiasikan; bukan pengambilalihan yang telah selesai.&lt;/p&gt;&lt;div class=&quot;source&quot;&gt;&lt;a href=&quot;https://stockbit.com/post/35482549&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;4 September 2026 · @Stockbit · Stream 35482549&lt;/a&gt;&lt;span class=&quot;locator&quot;&gt; · arsip, baris fisik 6224–6246&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li class=&quot;item&quot; id=&quot;p35459425&quot;&gt;&lt;strong&gt;Penawaran tender / SINI&lt;/strong&gt;&lt;p&gt;Penulis menjelaskan penawaran tender setelah perubahan pengendali tidak otomatis berarti pembeli ingin menyerap seluruh saham publik. Harga tender, tujuan transaksi, dan ketentuan kepemilikan harus dibedakan.&lt;/p&gt;&lt;div class=&quot;source&quot;&gt;&lt;a href=&quot;https://stockbit.com/post/35459425&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;4 September 2026 · @Mirzal · Stream 35459425&lt;/a&gt;&lt;span class=&quot;locator&quot;&gt; · arsip, baris fisik 16488–16559&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li class=&quot;item&quot; id=&quot;p35477307&quot;&gt;&lt;strong&gt;PACK / MGLV / SRSN / COAL&lt;/strong&gt;&lt;p&gt;Pengguna menyaring perubahan usaha melalui laporan keuangan dan profil calon pembeli. Harapan COAL akan diakuisisi masih keinginan penulis, berbeda dari perusahaan dengan pengumuman transaksi.&lt;/p&gt;&lt;div class=&quot;source&quot;&gt;&lt;a href=&quot;https://stockbit.com/post/35477307&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;4 September 2026 · @TjoeanTjoek · Stream 35477307&lt;/a&gt;&lt;span class=&quot;locator&quot;&gt; · arsip, baris fisik 7152–7170&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li class=&quot;item&quot; id=&quot;p35460808&quot;&gt;&lt;strong&gt;SWAP&lt;/strong&gt;&lt;p&gt;SWAP: penundaan penawaran saham dibahas bersama kebutuhan penyesuaian pengajuan dan lemahnya arus kas. Dugaan alasan lainnya tidak boleh dianggap keputusan resmi tanpa dokumen regulator.&lt;/p&gt;&lt;div class=&quot;source&quot;&gt;&lt;a href=&quot;https://stockbit.com/post/35460808&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;4 September 2026 · @Nasrul47 · Stream 35460808&lt;/a&gt;&lt;span class=&quot;locator&quot;&gt; · arsip, baris fisik 9978–10035&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li class=&quot;item&quot; id=&quot;p35459965&quot;&gt;&lt;strong&gt;ARCI&lt;/strong&gt;&lt;p&gt;ARCI: peningkatan produksi dibandingkan dengan kemampuan mengubahnya menjadi laba dan kas. Besarnya produksi saja tidak cukup tanpa biaya per unit serta kebutuhan investasi.&lt;/p&gt;&lt;div class=&quot;source&quot;&gt;&lt;a href=&quot;https://stockbit.com/post/35459965&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;4 September 2026 · @Rohal · Stream 35459965&lt;/a&gt;&lt;span class=&quot;locator&quot;&gt; · arsip, baris fisik 14159–14193&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li class=&quot;item&quot; id=&quot;p35459338&quot;&gt;&lt;strong&gt;NELY&lt;/strong&gt;&lt;p&gt;NELY: pendapatan yang turun tajam dibandingkan dengan laba kuartalan yang berbalik positif dan penagihan. Pemulihan laba perlu diuji terhadap penurunan kegiatan usaha.&lt;/p&gt;&lt;div class=&quot;source&quot;&gt;&lt;a href=&quot;https://stockbit.com/post/35459338&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;4 September 2026 · @kurosagi · Stream 35459338&lt;/a&gt;&lt;span class=&quot;locator&quot;&gt; · arsip, baris fisik 16995–17073&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;/ol&gt;&lt;/details&gt;
&lt;details class=&quot;day&quot; id=&quot;d2026-09-05&quot;&gt;&lt;summary&gt;5 September 2026&lt;span class=&quot;count&quot;&gt;10 pilihan dari 360 unggahan&lt;/span&gt;&lt;/summary&gt;&lt;ol class=&quot;daily&quot;&gt;
&lt;li class=&quot;item&quot; id=&quot;p35503199&quot;&gt;&lt;strong&gt;KDTN&lt;/strong&gt;&lt;p&gt;KDTN: unggahan membedakan perjanjian bersyarat Ruby dari pengambilalihan selesai, tetapi menyebut data Sherman belum memadai. Pemeriksaan dokumen perusahaan dalam laporan ini menemukan informasi keuangan dan harga yang sudah tersedia.&lt;/p&gt;&lt;div class=&quot;source&quot;&gt;&lt;a href=&quot;https://stockbit.com/post/35503199&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;5 September 2026 · @caciNAGA · Stream 35503199&lt;/a&gt;&lt;span class=&quot;locator&quot;&gt; · arsip, baris fisik 760–1774&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li class=&quot;item&quot; id=&quot;p35501282&quot;&gt;&lt;strong&gt;KLBF&lt;/strong&gt;&lt;p&gt;KLBF: penulis tidak langsung memakai rata-rata kelipatan laba historis sebagai nilai wajar. Ia membandingkan skenario konservatif dengan risiko bahwa penilaian lama tidak lagi relevan.&lt;/p&gt;&lt;div class=&quot;source&quot;&gt;&lt;a href=&quot;https://stockbit.com/post/35501282&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;5 September 2026 · @redia84 · Stream 35501282&lt;/a&gt;&lt;span class=&quot;locator&quot;&gt; · arsip, baris fisik 5321–5398&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li class=&quot;item&quot; id=&quot;p35503061&quot;&gt;&lt;strong&gt;ADHI&lt;/strong&gt;&lt;p&gt;ADHI–PTPP: beberapa bentuk penggabungan dibandingkan tanpa menetapkan perusahaan yang bertahan atau rasio pertukaran. Kewajiban utang tetap menjadi risiko perusahaan gabungan.&lt;/p&gt;&lt;div class=&quot;source&quot;&gt;&lt;a href=&quot;https://stockbit.com/post/35503061&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;5 September 2026 · @Nasrul47 · Stream 35503061&lt;/a&gt;&lt;span class=&quot;locator&quot;&gt; · arsip, baris fisik 1819–1931&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li class=&quot;item&quot; id=&quot;p35502730&quot;&gt;&lt;strong&gt;Pemulihan usaha&lt;/strong&gt;&lt;p&gt;Perbandingan delapan emiten membedakan pemulihan operasi dari laba yang belum didukung arus kas. Penilaian tiap perusahaan tetap harus dicocokkan dengan laporan asal.&lt;/p&gt;&lt;div class=&quot;source&quot;&gt;&lt;a href=&quot;https://stockbit.com/post/35502730&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;5 September 2026 · @klinikporto · Stream 35502730&lt;/a&gt;&lt;span class=&quot;locator&quot;&gt; · arsip, baris fisik 2006–2084&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li class=&quot;item&quot; id=&quot;p35501451&quot;&gt;&lt;strong&gt;AADI&lt;/strong&gt;&lt;p&gt;AADI: pengguna mengutamakan pembacaan siklus komoditas dan valuasi berbasis ekuitas. Kelipatan yang dianggap wajar serta hasil dividen yang diproyeksikan tetap asumsi penulis.&lt;/p&gt;&lt;div class=&quot;source&quot;&gt;&lt;a href=&quot;https://stockbit.com/post/35501451&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;5 September 2026 · @agasmhndr · Stream 35501451&lt;/a&gt;&lt;span class=&quot;locator&quot;&gt; · arsip, baris fisik 4749–4836&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li class=&quot;item&quot; id=&quot;p35502059&quot;&gt;&lt;strong&gt;SSMS&lt;/strong&gt;&lt;p&gt;SSMS: penulis menyajikan beberapa skenario nilai, bukan satu angka kepastian. Utang, harga minyak sawit, dan arus kas menjadi penentu apakah valuasi dapat dibenarkan.&lt;/p&gt;&lt;div class=&quot;source&quot;&gt;&lt;a href=&quot;https://stockbit.com/post/35502059&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;5 September 2026 · @Afrizaldkurniawan · Stream 35502059&lt;/a&gt;&lt;span class=&quot;locator&quot;&gt; · arsip, baris fisik 3209–3233&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li class=&quot;item&quot; id=&quot;p35501701&quot;&gt;&lt;strong&gt;BULL&lt;/strong&gt;&lt;p&gt;BULL: pengguna mempertanyakan piutang dalam rekonsiliasi dan menyebut riwayat opini auditor dengan pengecualian. Usulan menghapus nilai piutang adalah pendapat, bukan kebijakan perusahaan yang telah diumumkan.&lt;/p&gt;&lt;div class=&quot;source&quot;&gt;&lt;a href=&quot;https://stockbit.com/post/35501701&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;5 September 2026 · @edria94 · Stream 35501701&lt;/a&gt;&lt;span class=&quot;locator&quot;&gt; · arsip, baris fisik 3845–3854&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li class=&quot;item&quot; id=&quot;p35502153&quot;&gt;&lt;strong&gt;Pola harga&lt;/strong&gt;&lt;p&gt;Penulis membedakan jarak harga dari rata-ratanya dengan perubahan jarak tersebut. Harga yang jauh dari rata-rata tidak otomatis berbalik; metode ini bukan bukti perubahan bisnis.&lt;/p&gt;&lt;div class=&quot;source&quot;&gt;&lt;a href=&quot;https://stockbit.com/post/35502153&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;5 September 2026 · @ariefhidayatst · Stream 35502153&lt;/a&gt;&lt;span class=&quot;locator&quot;&gt; · arsip, baris fisik 2794–2886&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li class=&quot;item&quot; id=&quot;p35502430&quot;&gt;&lt;strong&gt;MDLN&lt;/strong&gt;&lt;p&gt;MDLN: rencana pengalihan aset disebut belum memperoleh persetujuan rapat sehingga perlu rapat kedua. Pengumuman rencana tidak boleh disamakan dengan persetujuan dan transaksi terlaksana.&lt;/p&gt;&lt;div class=&quot;source&quot;&gt;&lt;a href=&quot;https://stockbit.com/post/35502430&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;5 September 2026 · @primestockid · Stream 35502430&lt;/a&gt;&lt;span class=&quot;locator&quot;&gt; · arsip, baris fisik 2145–2154&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li class=&quot;item&quot; id=&quot;p35502285&quot;&gt;&lt;strong&gt;BULL&lt;/strong&gt;&lt;p&gt;BULL: penulis menjelaskan laporan baik tidak harus segera diikuti kenaikan harga. Namun keyakinannya harga pada akhirnya naik tetap prediksi, bukan kesimpulan yang dijamin oleh laporan.&lt;/p&gt;&lt;div class=&quot;source&quot;&gt;&lt;a href=&quot;https://stockbit.com/post/35502285&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;5 September 2026 · @teddyed · Stream 35502285&lt;/a&gt;&lt;span class=&quot;locator&quot;&gt; · arsip, baris fisik 2383–2436&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;/ol&gt;&lt;/details&gt;
&lt;/section&gt;&lt;section id=&quot;verifikasi&quot;&gt;&lt;h2&gt;Pemeriksaan terbatas di luar arsip&lt;/h2&gt;&lt;p&gt;Hasil berikut berasal dari dokumen perusahaan atau bursa, bukan dari suara mayoritas Stockbit. Dokumen bertanggal lama menjelaskan apa yang telah dipublikasikan saat itu, bukan otomatis status transaksi pada hari laporan ini disusun.&lt;/p&gt;
&lt;div class=&quot;note&quot;&gt;&lt;strong&gt;KDTN: data ekonomi Sherman sudah tersedia pada 13 Mei.&lt;/strong&gt; Dokumen memuat harga rencana pembelian 99% sebesar Rp93,061 miliar; pendapatan 2025 Rp304,831 miliar, laba komprehensif Rp9,577 miliar, aset Rp108,746 miliar dan ekuitas Rp31,100 miliar. Tabel juga mencatat Hsieh Wei Tong sebagai pemegang langsung 100% Sherman Mineral Trading di Singapura. Ini belum membuktikan pemilik manfaat terakhir atau hubungan orang tersebut dengan Ruby. Sumber: halaman tercetak 12–13. Versi 22 Mei tidak berhasil dibaca lengkap, sehingga angka ini tidak disebut ketentuan final.&lt;/div&gt;
&lt;div class=&quot;table-wrap&quot;&gt;&lt;table class=&quot;&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Objek / tanggal dokumen&lt;/th&gt;&lt;th&gt;Hasil pemeriksaan&lt;/th&gt;&lt;th&gt;Yang tidak terbukti&lt;/th&gt;&lt;th&gt;Sumber primer&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;KDTN — pembelian bersyarat&lt;br&gt;2026-04-24&lt;br&gt;&lt;span class=&#x27;badge&#x27;&gt;Dokumen dibaca&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Perjanjian 22 April untuk sekitar 86% saham oleh Ruby; penawaran wajib mengikuti jika pengambilalihan selesai.&lt;/td&gt;&lt;td&gt;Bukan bukti transaksi sudah efektif pada 5 atau 14 September.&lt;/td&gt;&lt;td&gt;&lt;a target=&quot;_blank&quot; rel=&quot;noopener&quot; href=&quot;https://www.purisentulpermai.com/images/2026/KIKDTN/KI_KDTN_Full_Rencana_Pengambilalihan_KDTN_Ruby_Mining_240426.pdf&quot;&gt;Buka dokumen&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;KDTN — data Sherman dan hubungan pihak&lt;br&gt;2026-05-13&lt;br&gt;&lt;span class=&#x27;badge&#x27;&gt;Dokumen dan tabel dibaca&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Harga rencana 99% Sherman sekitar Rp93,061 miliar; ada ringkasan keuangan 2025 dan Hsieh Wei Tong sebagai pemegang langsung 100% perusahaan penjual di Singapura. Hubungan afiliasi penerima hotel dijelaskan.&lt;/td&gt;&lt;td&gt;Tidak membuktikan cadangan tambang, pemilik manfaat terakhir, hubungan dengan Ruby, atau penyelesaian transaksi. Laba dalam tabel berlabel laba komprehensif.&lt;/td&gt;&lt;td&gt;&lt;a target=&quot;_blank&quot; rel=&quot;noopener&quot; href=&quot;https://www.purisentulpermai.com/images/2026/KIKDTN/KI_RUPSLBdanRUPSI_rev_13052026_KDTN.pdf&quot;&gt;Buka dokumen&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;KDTN — pembaruan setelah 13 Mei&lt;br&gt;2026-05-22&lt;br&gt;&lt;span class=&#x27;badge&#x27;&gt;Tidak berhasil dibaca lengkap&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Versi pengungkapan tanggal 22 Mei tercantum pada situs perusahaan.&lt;/td&gt;&lt;td&gt;Rincian terbaru dalam versi ini tidak diperiksa; angka 13 Mei tidak disebut sebagai ketentuan final.&lt;/td&gt;&lt;td&gt;&lt;a target=&quot;_blank&quot; rel=&quot;noopener&quot; href=&quot;https://www.purisentulpermai.com/images/2026/KIKDTN/KI_KDTN_Full_OK_22_Mei_2026_Final.pdf&quot;&gt;Buka dokumen&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;KDTN — rapat independen&lt;br&gt;2026-06-15&lt;br&gt;&lt;span class=&#x27;badge&#x27;&gt;Dokumen dibaca&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Pengumuman menunda rapat independen yang direncanakan 22 Juni setelah surat Otoritas Jasa Keuangan 5 Juni dan kebutuhan pemenuhan ketentuan pengambilalihan.&lt;/td&gt;&lt;td&gt;15 Juni adalah tanggal pengumuman penundaan, bukan tanggal rapat yang semula direncanakan. Tidak menetapkan status terakhir September.&lt;/td&gt;&lt;td&gt;&lt;a target=&quot;_blank&quot; rel=&quot;noopener&quot; href=&quot;https://www.purisentulpermai.com/images/2026/KIKDTN/RUPSIndependen/PenundaanRUPSI/Pengumuman_Penundaan_RUP-SI_KDTN_2026_Final_OK.pdf&quot;&gt;Buka dokumen&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;TerraCom — contoh dalam instruksi&lt;br&gt;2025-12-23&lt;br&gt;&lt;span class=&#x27;badge&#x27;&gt;Sebagian rantai terverifikasi&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Pengumuman bursa Australia memuat rencana penerbitan A$60 juta dan dukungan penyerapan Orbit hingga A$40 juta, dengan skenario kepemilikan maksimum 55,31%.&lt;/td&gt;&lt;td&gt;Bukan temuan arsip. Dokumen ini tidak membuktikan pembelian Orbit oleh NATO/Quantum atau hasil akhir 45,84%.&lt;/td&gt;&lt;td&gt;&lt;a target=&quot;_blank&quot; rel=&quot;noopener&quot; href=&quot;https://announcements.asx.com.au/asxpdf/20251223/pdf/06tpkghwr1l02g.pdf&quot;&gt;Buka dokumen&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;FORU — prospektus luar periode&lt;br&gt;2026-09-14&lt;br&gt;&lt;span class=&#x27;badge&#x27;&gt;Akses dokumen gagal&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Dokumen terdeteksi pada situs bursa; akses penuh ditolak.&lt;/td&gt;&lt;td&gt;Tidak digunakan mengubah sejarah arsip yang berakhir 5 September. Angka FORU dalam laporan tetap diatribusikan kepada penulis unggahan.&lt;/td&gt;&lt;td&gt;&lt;a target=&quot;_blank&quot; rel=&quot;noopener&quot; href=&quot;https://www.idx.co.id/StaticData/NewsAndAnnouncement/ANNOUNCEMENTSTOCK/From_EREP/202609/4bf4620c56_4cabb5d4ac.pdf&quot;&gt;Buka dokumen&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;KOKA — paparan publik&lt;br&gt;2026-01-05&lt;br&gt;&lt;span class=&#x27;badge&#x27;&gt;Akses dokumen gagal&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Dokumen tanggapan paparan publik terdeteksi; akses penuh ditolak.&lt;/td&gt;&lt;td&gt;Tidak dipakai sebagai konfirmasi hipotesis penerbitan saham @Lash.&lt;/td&gt;&lt;td&gt;&lt;a target=&quot;_blank&quot; rel=&quot;noopener&quot; href=&quot;https://www.idx.co.id/StaticData/NewsAndAnnouncement/ANNOUNCEMENTSTOCK/From_EREP/202601/c3162c5e58_68811bbf5a.pdf&quot;&gt;Buka dokumen&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;/section&gt;&lt;section id=&quot;metode&quot;&gt;&lt;h2&gt;Metode dan batas penggunaan&lt;/h2&gt;&lt;p&gt;Dasar utama: arsip Stockbit kategori Ideas, tanggal tertulis 1 Agustus–5 September 2026; diekspor 14 September 2026. Catatan instruksi digunakan sebagai arah penelusuran, bukan sebagai bukti transaksi.&lt;/p&gt;&lt;p&gt;Seluruh 36.032 blok unggahan dipisahkan dengan penanda tanggal, penulis, Stream ID dan Parent ID. Semua nomor unggahan unik. Pemeriksaan komputer mencakup seluruh teks; pembacaan dekat dan ringkasan dilakukan pada unggahan yang dipilih.&lt;/p&gt;&lt;p&gt;Frekuensi menandai satu kemunculan kode bertanda dolar per unggahan, tanpa menambah hitungan bila kode diulang. Tag acak tetap terhitung. Daftar frekuensi kode empat huruf bukan daftar emiten aktif yang telah dicocokkan dengan bursa. Indeks IHSG dipisahkan.&lt;/p&gt;&lt;p&gt;Jumlah penulis dihitung dari nama pengguna persis sebagaimana tersimpan. Satu orang dapat memiliki lebih dari satu akun. Akun yang berbeda tidak otomatis merupakan pendapat yang independen.&lt;/p&gt;&lt;p&gt;Kategori topik menggunakan pencocokan kata kunci; satu unggahan dapat memiliki beberapa kategori. Hasilnya bukan klasifikasi sentimen atau penghitungan pasti semua aksi korporasi. Unggahan sangat pendek sering hanya berisi tag, reaksi, atau harapan.&lt;/p&gt;&lt;p&gt;Sepuluh pilihan setiap tanggal dinilai dari kejelasan mekanisme, rincian yang bisa diperiksa, pembahasan risiko, perbedaan sudut pandang dan cakupan topik. Pilihan adalah penilaian editorial, bukan urutan popularitas atau keberhasilan harga. Tidak semua hari memiliki sepuluh temuan korporasi bermutu sama.&lt;/p&gt;&lt;p&gt;Pilihan mingguan memakai pekan kalender Senin–Minggu yang dipotong sesuai batas arsip. Pekan pertama hanya 1–2 Agustus, pekan terakhir 31 Agustus–5 September. Lima pilihan setiap pekan dapat berupa argumen baik atau contoh yang penting dikritisi.&lt;/p&gt;&lt;p&gt;Tidak tersedia angka suka, jangkauan, seluruh balasan, gambar atau tabel yang disebut penulis, maupun rangkaian harga yang memadai. Tidak dibuat peringkat kecerdasan, hasil investasi, persentase pendapat positif, atau keuntungan tanpa risiko.&lt;/p&gt;&lt;p&gt;Seluruh harga, rasio dan peristiwa yang berada dalam ringkasan unggahan adalah pernyataan historis penulis kecuali secara eksplisit dimasukkan pada bagian Verifikasi. Informasi di luar arsip diberi tanggal dokumen dan tidak diam-diam dipakai untuk memperbaiki cerita masa lalu.&lt;/p&gt;&lt;p&gt;Tautan Stockbit dibentuk dari nomor unggahan yang tersimpan. Ketersediaan halaman langsung belum diuji dan dapat membutuhkan masuk akun. Nomor baris merujuk pemisah baris fisik LF dalam berkas teks; alat pembaca lain dapat menghitung pemisah Unicode sebagai baris tambahan. Stream ID adalah penunjuk utama.&lt;/p&gt;&lt;p&gt;Arsip bersama tidak menjamin seluruh isi Stockbit terkumpul. Interpretasi zona waktu pada header belum terverifikasi. Ketimpangan jumlah unggahan antartanggal tidak boleh diperlakukan sebagai lonjakan minat pasar tanpa pemeriksaan cakupan.&lt;/p&gt;
&lt;h3&gt;Aturan kata kunci yang dapat diperiksa&lt;/h3&gt;&lt;p class=&quot;small&quot;&gt;Pola berikut adalah alat penyaringan awal. Label tidak menyatakan bahwa semua kata dalam unggahan benar, relevan dengan tag, atau didukung dokumen.&lt;/p&gt;

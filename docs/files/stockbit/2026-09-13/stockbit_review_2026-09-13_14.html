&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;header&gt;&lt;div class=&quot;eyebrow&quot;&gt;CATATAN PENELUSURAN • 14 SEPTEMBER 2026&lt;/div&gt;&lt;h1&gt;Aksi korporasi, hubungan perusahaan, dan spekulasi dalam arsip Stockbit&lt;/h1&gt;&lt;p&gt;Arsip 13–14 September 2026. Pernyataan pengguna, hasil pemeriksaan luar, dan penafsiran dipisahkan.&lt;/p&gt;&lt;/header&gt;&lt;main&gt;&lt;nav&gt;&lt;a href=&quot;#kesimpulan&quot;&gt;Kesimpulan&lt;/a&gt;&lt;a href=&quot;#jarang&quot;&gt;Jarang disebut&lt;/a&gt;&lt;a href=&quot;#temuan&quot;&gt;Temuan&lt;/a&gt;&lt;a href=&quot;#relasi&quot;&gt;Relasi&lt;/a&gt;&lt;a href=&quot;#kode&quot;&gt;Kode&lt;/a&gt;&lt;a href=&quot;#pilihan&quot;&gt;Pilihan mingguan&lt;/a&gt;&lt;a href=&quot;#indeks&quot;&gt;Indeks&lt;/a&gt;&lt;a href=&quot;#sumber&quot;&gt;Sumber&lt;/a&gt;&lt;/nav&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;strong&gt;1.492&lt;/strong&gt;&lt;span&gt;postingan unik&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;strong&gt;1.051&lt;/strong&gt;&lt;span&gt;akun&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;strong&gt;26&lt;/strong&gt;&lt;span&gt;temuan terpilih&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;strong&gt;12&lt;/strong&gt;&lt;span&gt;kode dan candaan&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;searchbox&quot;&gt;&lt;label for=&quot;q&quot;&gt;&lt;strong&gt;Cari isi tabel&lt;/strong&gt;&lt;/label&gt;&lt;input id=&quot;q&quot; type=&quot;search&quot; placeholder=&quot;Kode saham, nama akun, stream_id, atau istilah…&quot;&gt;&lt;span class=&quot;small&quot;&gt;Pencarian berlaku pada tabel. Hapus pencarian untuk menampilkan semua baris.&lt;/span&gt;&lt;/div&gt;
&lt;section id=&quot;kesimpulan&quot;&gt;&lt;h2&gt;Kesimpulan utama&lt;/h2&gt;
&lt;p&gt;&lt;strong&gt;LAPD dan BESS menghasilkan hubungan orang–perusahaan yang paling berguna untuk ditelusuri.&lt;/strong&gt;
Pada LAPD, halaman resmi menghubungkan dua pengurus dengan perusahaan target. Pada BESS, hubungan
Djauhar Maulidi dengan Bina Indo Raya dan RAJA dapat diperkuat, tetapi transaksi yang melibatkan BESS belum terbukti.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;FORU menuntut pembacaan struktur pendanaan, bukan sekadar ukuran aset.&lt;/strong&gt;
KSEI telah mengumumkan kode FORU-R dengan harga pelaksanaan Rp126, distribusi 24 September,
pencatatan 25 September, dan jatuh tempo 6 Oktober 2026. Keberadaan jadwal tidak membuktikan seluruh uang tunai sudah masuk.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;PIPA, KOKA, dan NINE layak dipisahkan menurut tahapnya.&lt;/strong&gt; Perjanjian bersyarat, anak usaha yang dibentuk,
dan rencana memasukkan aset adalah peristiwa berbeda dari penyelesaian transaksi serta laba untuk pemegang saham.&lt;/p&gt;
&lt;p&gt;Untuk gagasan yang jarang dibahas, BESS dan MOLI masing-masing hanya muncul dalam satu postingan.
MOLI lebih tepat diteliti sebagai ekspansi bisnis berjalan; LCKM–CCSI masih merupakan dugaan berdasarkan perbandingan industri.&lt;/p&gt;
&lt;p class=&quot;note&quot;&gt;Hubungan yang terlihat bukan pembuktian nominee, pengendali tersembunyi, atau keuntungan pasti.
Contoh historis dalam berkas instruksi tidak dihitung sebagai temuan baru dalam arsip.&lt;/p&gt;&lt;/section&gt;
&lt;section id=&quot;metode&quot;&gt;&lt;h2&gt;Cakupan, metode, dan kekurangan data&lt;/h2&gt;
&lt;p&gt;Arsip terdiri dari 573 postingan berlabel 13 September dan 919 berlabel 14 September 2026, dengan 1.492 nomor postingan unik
dan 1.051 akun. Sebanyak 1.235 postingan (82,8%) berisi kurang dari 50 kata menurut pemisah spasi.
Akun @agumdarmawan2402 menyumbang 31 postingan dan sekitar 23,0% jumlah kata; panjang tulisan tidak dijadikan ukuran kebenaran.&lt;/p&gt;
&lt;p&gt;Setiap kode dihitung maksimal sekali per postingan. Hitungan penanda $ terpisah dari penyebutan literal dalam isi.
URL tidak dipakai sebagai penyebutan dalam isi. Penanda acak, indeks, komoditas, dan waran tidak otomatis menjadi pembahasan
saham utama. Frekuensi bukan ukuran dukungan, keyakinan penulis, atau kemandirian sumber.&lt;/p&gt;
&lt;p&gt;Postingan PIPA 35735052 dan 35735514 memiliki isi yang sangat mirip. Keduanya tetap dua postingan dalam indeks, tetapi
bukan dua konfirmasi independen. Nomor induk yang sama dengan nomor postingan tidak dijadikan alasan menghapus data.&lt;/p&gt;
&lt;p&gt;Arsip hanya mencakup dua tanggal. Minggu 7–13 September hanya diwakili tanggal 13; minggu 14–20 September hanya tanggal 14.
Waktu mengikuti label arsip; interpretasi waktu API belum terverifikasi. Foto, tangkapan layar, dan lampiran yang dirujuk
di postingan tidak tersedia dalam berkas teks.&lt;/p&gt;
&lt;p&gt;Penelusuran luar bersifat terarah. Tidak ada klaim bahwa seluruh akta administrasi badan hukum, data kustodian,
perubahan biro administrasi efek, auditor, registrasi merek, perizinan, atau dokumen asing sudah diperiksa.
Sumber yang tidak dapat dibuka ditandai pada daftar sumber.&lt;/p&gt;&lt;/section&gt;
&lt;section id=&quot;argumen&quot;&gt;&lt;h2&gt;Argumen yang patut dipertahankan — dan dibatasi&lt;/h2&gt;
&lt;p&gt;&lt;strong&gt;FORU:&lt;/strong&gt; nilai tambang tidak mengatasi kekurangan modal angkutan dan produksi. Periksa uang masuk,
siapa yang menyerap saham, kepada siapa dana dipinjamkan, dan bagian laba target yang menjadi hak emiten.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;LAPD:&lt;/strong&gt; analisis aset yang dimasukkan berguna, tetapi hitungan rasio harga terhadap ekuitas dalam postingan
belum terurai. Pembagian Rp274 miliar dengan Rp81,34 miliar menghasilkan sekitar 3,37, bukan 3,67.
Itu pun belum menjadi valuasi yang benar karena nilai pasar sebelum penerbitan harus diselaraskan dengan ekuitas sesudah penerbitan.
Penerbitan saham yang lebih besar tidak dengan sendirinya lebih menguntungkan.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;INET:&lt;/strong&gt; pertumbuhan dari menggabungkan anak usaha berbeda dari pertumbuhan usaha lama.
Kas hasil utang atau penerbitan saham berbeda dari kas yang dihasilkan kegiatan usaha.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;MOLI dan IRSX:&lt;/strong&gt; penunjukan pemasok atau nota kesepahaman harus dibedakan dari kontrak dengan volume,
harga, pembayaran, dan pendapatan yang dapat dibuktikan.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Ringkasan broker:&lt;/strong&gt; nama perusahaan sekuritas tidak mengungkap pasti pemilik manfaat terakhir.
Harga rata-rata suatu broker bukan jaminan harga tidak turun.&lt;/p&gt;&lt;/section&gt;
&lt;section id=&quot;jarang&quot;&gt;&lt;h2&gt;Jarang disebut, dengan pertanyaan penelitian yang spesifik&lt;/h2&gt;&lt;p class=&quot;small&quot;&gt;Hitungan literal mencakup kode dengan dan tanpa $. Jumlah ini bukan banyaknya tesis yang saling independen.&lt;/p&gt;&lt;div class=&quot;table-wrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Kode&lt;/th&gt;&lt;th&gt;Postingan&lt;/th&gt;&lt;th&gt;Penulis utama&lt;/th&gt;&lt;th&gt;stream_id&lt;/th&gt;&lt;th&gt;Pokok petunjuk&lt;/th&gt;&lt;th&gt;Bukti lanjutan&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;BESS&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;@athira&lt;/td&gt;&lt;td&gt;35765267&lt;/td&gt;&lt;td&gt;Hubungan orang dan perusahaan&lt;/td&gt;&lt;td&gt;Akta pemegang saham Bina Indo Raya; sumber angka 20%; kontrak BESS; keterbukaan target akuisisi.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;MOLI&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;@candraahmadi8&lt;/td&gt;&lt;td&gt;35776260&lt;/td&gt;&lt;td&gt;Ekspansi kapasitas nyata&lt;/td&gt;&lt;td&gt;Kontrak, volume kirim, marjin, kemajuan pembangunan; periksa pernyataan tidak ada aksi korporasi baru.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;LCKM&lt;/td&gt;&lt;td&gt;2&lt;/td&gt;&lt;td&gt;@athira&lt;/td&gt;&lt;td&gt;35731442&lt;/td&gt;&lt;td&gt;Dugaan konsolidasi industri&lt;/td&gt;&lt;td&gt;Calon pembeli yang teridentifikasi, perubahan pemegang saham, kontrak, keterbukaan perubahan kendali.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;NINE&lt;/td&gt;&lt;td&gt;2&lt;/td&gt;&lt;td&gt;@Novall2&lt;/td&gt;&lt;td&gt;35774955&lt;/td&gt;&lt;td&gt;Aset luar negeri dan penundaan&lt;/td&gt;&lt;td&gt;Laporan terkini; dokumen PGGR; konsesi Mongolia; persetujuan investasi luar negeri; syarat pendanaan.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;BLES&lt;/td&gt;&lt;td&gt;3&lt;/td&gt;&lt;td&gt;@candraahmadi8&lt;/td&gt;&lt;td&gt;35732578&lt;/td&gt;&lt;td&gt;Pemulihan usaha&lt;/td&gt;&lt;td&gt;Izin final pabrik, penjualan berkelanjutan, marjin, utang dan kas.&lt;/td&gt;&
